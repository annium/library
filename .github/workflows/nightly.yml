name: Nightly

# The merge-request suite on a schedule, and nothing more. It shares its recipes with the day pipeline
# rather than having `-nightly` variants of its own, because there is no longer any difference to express.
#
# There was: the nightly used to run the finance `read` block against the real exchanges, to catch API
# drift early. That is gone for good - see the note above ci-test-framework in the justfile. Briefly: the
# block hung and took the job's 45-minute timeout with it, and even with the deadlines that now stop that,
# a hosted runner sits in a cloud range that exchanges refuse, so it would fail every night for a reason
# that says nothing about our code. Drift is caught by a reconcile pass run from where the exchange
# answers, which is a person's job.
#
# The `write` block has no counterpart anywhere in CI either, and for a stronger reason: its documented
# procedure - check the position mode, that no position exists on the test symbol the fixture would close
# as cleanup, and the available margin, then run it alone - is something a person does, and a cancelled
# runner leaves that cleanup unrun and a real position open.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  check:
    uses: annium/workflows/.github/workflows/dotnet-run.yml@v2
    with:
      recipe: ci-check

  test:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        group: [ framework, adapters ]
    uses: annium/workflows/.github/workflows/dotnet-test.yml@v2
    with:
      recipe: ci-test-${{ matrix.group }}
      artifact: test-results-${{ matrix.group }}
      # no environment: nothing here reads exchange credentials, and requesting an environment whose
      # secrets nothing reads only widens what the job can reach
    secrets: inherit

  report:
    needs: test
    if: ${{ always() }}
    uses: annium/workflows/.github/workflows/test-report.yml@v2
